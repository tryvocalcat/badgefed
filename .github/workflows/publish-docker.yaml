name: Publish Docker image

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/publish-docker.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/badgefed:latest
            ghcr.io/${{ github.repository_owner }}/badgefed:${{ github.ref_name }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/badgefed:{1}', github.repository_owner, github.ref_name) || '' }}
          platforms: linux/amd64,linux/arm64